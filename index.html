<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Supabase 共享文件库</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5;text-align:center}
#drop-zone{border:2px dashed #ccc;padding:40px;margin:20px auto;max-width:500px;background:white;cursor:pointer;transition:.2s}
#drop-zone:hover{border-color:#3ECF8E}
.file-item{background:white;padding:10px;margin:5px auto;max-width:500px;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:5px 10px;margin-left:5px;cursor:pointer}
</style>
</head>

<body>

<h1>☁️ Supabase 文件库</h1>

<div id="status">初始化中...</div>

<div id="drop-zone">📂 拖拽文件到这里 / 点击上传</div>
<input type="file" id="file-input" multiple style="display:none">

<div id="file-list">加载中...</div>

<script>
const SUPABASE_URL = 'https://poyepondpknkzkuwgyxm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BY4eSXnpQAcMlEUReNhIeQ_n4wA0SEI';
const BUCKET = 'uploads';
const TABLE = 'files';

// ✅ 关键修复：不要叫 supabase
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusEl = document.getElementById('status');
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileListEl = document.getElementById('file-list');

statusEl.innerText = "✅ Supabase 已连接";

// 点击上传
dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => uploadFiles(e.target.files);

// 拖拽
['dragenter','dragover','dragleave','drop'].forEach(ev=>{
  dropZone.addEventListener(ev,e=>{
    e.preventDefault();
    e.stopPropagation();
  });
});

dropZone.addEventListener('dragover',()=>{
  dropZone.style.borderColor='#3ECF8E';
});

dropZone.addEventListener('dragleave',()=>{
  dropZone.style.borderColor='#ccc';
});

dropZone.addEventListener('drop',(e)=>{
  dropZone.style.borderColor='#ccc';
  uploadFiles(e.dataTransfer.files);
});

// 上传文件
async function uploadFiles(files){
  if(!files.length) return;

  statusEl.innerText = "⏳ 上传中...";

  for(let file of files){
    try{
      const path = `${Date.now()}_${file.name}`;

      const { error: upErr } = await supabaseClient.storage
        .from(BUCKET)
        .upload(path,file);

      if(upErr) throw upErr;

      const { data: urlData } = supabaseClient.storage
        .from(BUCKET)
        .getPublicUrl(path);

      const publicUrl = urlData.publicUrl;

      const { error: dbErr } = await supabaseClient
        .from(TABLE)
        .insert({
          original_name: file.name,
          storage_path: path,
          public_url: publicUrl,
          size_bytes: file.size,
          uploaded_at: new Date().toISOString()
        });

      if(dbErr) throw dbErr;

    }catch(err){
      alert("❌ "+file.name+" 失败: "+err.message);
    }
  }

  statusEl.innerText = "✅ 上传完成";
  fileInput.value = '';
  loadFiles();
}

// 加载文件
async function loadFiles(){
  fileListEl.innerHTML = "Loading...";

  const { data, error } = await supabaseClient
    .from(TABLE)
    .select('*')
    .order('uploaded_at',{ascending:false});

  if(error){
    fileListEl.innerHTML = "❌ "+error.message;
    return;
  }

  if(!data || !data.length){
    fileListEl.innerHTML = "暂无文件";
    return;
  }

  fileListEl.innerHTML = "";

  data.forEach(f=>{
    const div = document.createElement('div');
    div.className='file-item';

    div.innerHTML=`
      <span>${f.original_name}</span>
      <div>
        <a class="btn" href="${f.public_url}" target="_blank">下载</a>
        <button class="btn" onclick="delFile('${f.id}','${f.storage_path}')">删除</button>
      </div>
    `;

    fileListEl.appendChild(div);
  });
}

// 删除
window.delFile = async (id,path)=>{
  if(!confirm("确定删除？")) return;

  await supabaseClient.storage.from(BUCKET).remove([path]);
  await supabaseClient.from(TABLE).delete().eq('id',id);

  loadFiles();
};

loadFiles();
</script>

</body>
</html>
